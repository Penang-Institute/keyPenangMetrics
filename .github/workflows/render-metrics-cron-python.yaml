# Workflow for Python metrics generation (scheduled)
name: Scheduled task (Python)

on: 
  schedule: 
    - cron: '00 5 * * THU'
  
permissions: read-all

jobs:
  render-metrics:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render metrics and Commit Results
        run: |
          python scripts/metrics.py
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add output/* data_history/*
          git commit -m 'Update metrics (Python)' || echo "No changes to commit"
          # No `|| echo` here: a rejected push must fail the job. Swallowing it published
          # nothing while the run went green. `git push` with nothing to push exits 0 anyway.
          git push origin

# Publishing to the website is handled by pistats/.github/workflows/update-submodules.yml,
# which pulls this submodule Thursdays at 12:00 UTC (after this 05:00 UTC render).
# The old publish-trigger dispatch and update-parent.yaml were removed: they needed an
# expiring cross-repo PAT.